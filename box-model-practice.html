<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Practice</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 40px;
        }

        /* =================================
           EXERCISE 1: BOX MODEL VISUALIZATION
           ================================= */

        .box-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .box {
            width: 200px;
            padding: 20px;
            border: 5px solid #333;
            margin: 10px;
            background-color: lightblue;
            text-align: center;
        }

        .content-box {
            background-color: lightblue;
        }

        .padding-box {
            background-color: lightgreen;
            padding: 40px;
        }

        .border-box {
            background-color: lightyellow;
            border: 10px solid orange;
        }

        .margin-box {
            background-color: lightpink;
            margin: 30px;
        }


        /* =================================
           EXERCISE 2: DEBUG THE LAYOUT
           ================================= */

        .broken-box {
            width: 300px;
            padding: 20px;
            border: none;
            box-sizing: border-box;
            background-color: lightblue;
        }


        /* =================================
           EXERCISE 3: CARD COMPONENT
           ================================= */

        .card {
            width: 300px;
            padding: 20px;
            border: 1px solid gray;
            background-color: white;
            margin-top: 20px;
        }

        .card img {
            width: calc(100% + 40px);
            height: 150px;
            object-fit: cover;
            display: block;
            margin: -20px -20px 20px -20px;
        }

        .card h3 {
            margin: 0 0 15px 0;
        }

        .card p {
            margin-bottom: 20px;
        }

        .card button {
            padding: 10px 20px;
            border: none;
            background-color: #333;
            color: white;
            cursor: pointer;
        }

        .card button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

         EXERCISE 1
         ================================= -->

            <p>This is the content area.</p>
        </div>
